# Gitleaks configuration for Secure AI Toolkit.
# This repository intentionally contains labelled Vulnerable: examples with
# synthetic credential-shaped strings. Prefer fixing examples to use obviously
# fake values; allowlist only the smallest possible match with a rationale.

title = "Secure AI Toolkit"

[extend]
useDefault = true

# Global path ignores that never hold live secrets in this pack.
[allowlist]
description = "Non-secret path noise"
paths = [
  '''(?i)\.git/''',
  '''(?i)LICENSE$''',
]

